version: '3'

vars:
  TOOLS_BIN: '{{.ROOT_DIR}}/.tools/bin'
  # Each tool is a release archive checked against this digest: the one in the release's own
  # checksums file.
  TOFU_VERSION: 1.12.6
  TOFU_SHA256: 5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8
  TFLINT_VERSION: 0.64.0
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  TFDOCS_VERSION: 0.24.0
  TFDOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
  # The modules whose inputs and outputs terraform-docs writes into their README.
  DOCUMENTED: modules/controlplane modules/runners modules/identity-issuer
  # D2, as spin-stack/ami pins it, and its flags there: one light theme, each diagram its own size.
  # docs/diagrams/icons are taken from the packages that repository pins (versions.yaml there:
  # aws-architecture-icons 07312026, simple-icons 16.33.0), checked against its digests.
  D2: terrastruct/d2@sha256:0f9237e0213338415de5ef7436c92450ddd04e0e6e7df2db3f41387322df97b9
  D2_FLAGS: >-
    --layout elk --elk-nodeNodeBetweenLayers 56 --elk-edgeNodeBetweenLayers 20
    --elk-padding '[top=40,left=24,bottom=24,right=24]' --theme 0 --pad 16 --scale 1

tasks:
  tools:tofu:
    desc: Install the pinned OpenTofu.
    status:
      - test -x {{.TOOLS_BIN}}/tofu && {{.TOOLS_BIN}}/tofu version | grep -q 'v{{.TOFU_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/tofu.zip https://github.com/opentofu/opentofu/releases/download/v{{.TOFU_VERSION}}/tofu_{{.TOFU_VERSION}}_linux_amd64.zip
      - echo "{{.TOFU_SHA256}}  {{.TOOLS_BIN}}/tofu.zip" | sha256sum --check --quiet
      - unzip -oq {{.TOOLS_BIN}}/tofu.zip tofu -d {{.TOOLS_BIN}}
      - rm {{.TOOLS_BIN}}/tofu.zip

  tools:tflint:
    desc: Install the pinned TFLint.
    status:
      - test -x {{.TOOLS_BIN}}/tflint && {{.TOOLS_BIN}}/tflint --version | grep -q 'version {{.TFLINT_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v{{.TFLINT_VERSION}}/tflint_linux_amd64.zip
      - echo "{{.TFLINT_SHA256}}  {{.TOOLS_BIN}}/tflint.zip" | sha256sum --check --quiet
      - unzip -oq {{.TOOLS_BIN}}/tflint.zip tflint -d {{.TOOLS_BIN}}
      - rm {{.TOOLS_BIN}}/tflint.zip

  tools:trivy:
    desc: Install the pinned Trivy.
    status:
      - "test -x {{.TOOLS_BIN}}/trivy && {{.TOOLS_BIN}}/trivy --version | grep -q 'Version: {{.TRIVY_VERSION}}$'"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v{{.TRIVY_VERSION}}/trivy_{{.TRIVY_VERSION}}_Linux-64bit.tar.gz
      - echo "{{.TRIVY_SHA256}}  {{.TOOLS_BIN}}/trivy.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/trivy.tgz -C {{.TOOLS_BIN}} trivy
      - rm {{.TOOLS_BIN}}/trivy.tgz

  tools:terraform-docs:
    desc: Install the pinned terraform-docs.
    status:
      - test -x {{.TOOLS_BIN}}/terraform-docs && {{.TOOLS_BIN}}/terraform-docs --version | grep -q 'v{{.TFDOCS_VERSION}} '
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/terraform-docs.tgz https://github.com/terraform-docs/terraform-docs/releases/download/v{{.TFDOCS_VERSION}}/terraform-docs-v{{.TFDOCS_VERSION}}-linux-amd64.tar.gz
      - echo "{{.TFDOCS_SHA256}}  {{.TOOLS_BIN}}/terraform-docs.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/terraform-docs.tgz -C {{.TOOLS_BIN}} terraform-docs
      - rm {{.TOOLS_BIN}}/terraform-docs.tgz

  docs:
    desc: Write each module's inputs and outputs into its README.
    deps: [tools:terraform-docs]
    cmds:
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml {{.ITEM}}"

  diagrams:
    desc: Render docs/diagrams/*.d2 into the SVGs beside them, the icons inside each.
    cmds:
      - >-
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        docker run --rm -u $(id -u):$(id -g) -v {{.ROOT_DIR}}:/work -w /work -e HOME=/tmp
        {{.D2}} {{.D2_FLAGS}} "$d" "${d%.d2}.svg" >/dev/null || exit 1; done

  # A picture nothing in a build reads is the one that drifts unnoticed: each SVG is rendered again
  # and has to be the one committed, byte for byte (D2 lays out the same source the same way).
  diagrams:check:
    desc: Fail when a committed SVG is not what its .d2 renders to.
    cmds:
      - >-
        tmp=$(mktemp -d); trap 'rm -rf $tmp' EXIT;
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        docker run --rm -u $(id -u):$(id -g) -v {{.ROOT_DIR}}:/work -v $tmp:/out -w /work -e HOME=/tmp
        {{.D2}} {{.D2_FLAGS}} "$d" "/out/$(basename ${d%.d2}).svg" >/dev/null || exit 1;
        cmp -s "$tmp/$(basename ${d%.d2}).svg" "${d%.d2}.svg" || { echo "${d%.d2}.svg is not what $d renders to: task diagrams"; exit 1; }; done

  lint:
    desc: Format-check, validate, lint and scan the modules, the examples and bootstrap, and hold each module to its tests.
    deps: [tools:tofu, tools:tflint, tools:trivy, tools:terraform-docs]
    # Nothing else parses these, and nothing runs them but an apply against an account - so a
    # module that stopped validating is found by the operator it was written for. The provider
    # is the one each lock file pins, cached under .tools so a second run downloads nothing.
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tools/tofu-plugins"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tools/tofu-plugins
      - "{{.TOOLS_BIN}}/tofu fmt -recursive -check -diff"
      - bash hack/security-group-descriptions.sh $(find modules -name '*.tf')
      - for: ['.', examples/complete, examples/minimal, bootstrap]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} validate -no-color"
      # What validate does not know (.tflint.hcl), against one configuration for every directory:
      # an absolute path, since a relative one is looked for in each directory it walks into.
      - "{{.TOOLS_BIN}}/tflint --init --config={{.ROOT_DIR}}/.tflint.hcl >/dev/null"
      - "{{.TOOLS_BIN}}/tflint --recursive --config={{.ROOT_DIR}}/.tflint.hcl --format compact"
      # AWS's misconfigurations, each one this installation decides against ignored at its
      # resource with the reason (#trivy:ignore), so a new one fails here.
      - "{{.TOOLS_BIN}}/trivy config --quiet --exit-code 1 --cache-dir {{.ROOT_DIR}}/.tools/trivy-cache --skip-dirs .tools ."
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml --output-check {{.ITEM}} >/dev/null || { echo '{{.ITEM}}/README.md is not what its variables and outputs say: task docs'; exit 1; }"
      - task: diagrams:check
      # What each module promises about who reaches what - the proxy the only machine the
      # internet reaches, no role able to write IAM or read another's secrets - asserted
      # against its plan, with no account.
      - for: [modules/controlplane, modules/runners, modules/identity-issuer]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} test -no-color"
