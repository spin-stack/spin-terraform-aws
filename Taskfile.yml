version: '3'

includes:
  common:
    taskfile: '{{.GO_TOOLS_TASKS}}'
    flatten: true
    vars:
      RELEASE:
        map: {elsewhere: release.yml}

vars:
  TOOLS_BIN: '{{.ROOT_DIR}}/.tools/bin'
  # Each tool's release file, as versions.yaml pins it: `versions fetch` puts it here only as the
  # bytes the pin says, and fetches nothing again while it still is.
  DOWNLOADS: '{{.ROOT_DIR}}/.tools/downloads'
  # The command the release, the proposal, the fresh install's watch and lint's destroy order run
  # (cmd/spin-aws-dev; spin-aws-dev --help), so what they decide is Go with a test.
  SPIN_AWS_DEV: '{{.ROOT_DIR}}/_output/bin/spin-aws-dev'
  # The modules whose inputs and outputs terraform-docs writes into their README.
  DOCUMENTED: modules/controlplane modules/runners
  # D2's flags as spin-stack/ami has them: one light theme, each diagram its own size. The release
  # renders the committed SVGs byte for byte as the image it replaced did.
  # docs/diagrams/icons are taken from the packages that repository pins (its versions.yaml's
  # aws-architecture-icons and simple-icons), checked against its digests, then rewritten by svgo
  # (docs/diagrams/svgo.config.mjs).
  D2_FLAGS: >-
    --layout elk --elk-nodeNodeBetweenLayers 56 --elk-edgeNodeBetweenLayers 20
    --elk-padding '[top=40,left=24,bottom=24,right=24]' --theme 0 --pad 16 --scale 1

tasks:
  bin:
    desc: Build spin-aws-dev into _output/bin/.
    # Once per run: a task that runs it and one that builds it again at once is "text file busy".
    run: once
    cmds:
      # go run would flatten a verb's exit status to 1.
      - go build -o {{.SPIN_AWS_DEV}} ./cmd/spin-aws-dev

  tools:tofu:
    desc: Install the pinned OpenTofu.
    status:
      - test -x {{.TOOLS_BIN}}/tofu && {{.TOOLS_BIN}}/tofu version | grep -q "v$(versions version tofu)$"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch tofu {{.DOWNLOADS}}) && unzip -oq "$f" tofu -d {{.TOOLS_BIN}}

  tools:tflint:
    desc: Install the pinned TFLint.
    status:
      - test -x {{.TOOLS_BIN}}/tflint && {{.TOOLS_BIN}}/tflint --version | grep -q "version $(versions version tflint)$"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch tflint {{.DOWNLOADS}}) && unzip -oq "$f" tflint -d {{.TOOLS_BIN}}

  tools:trivy:
    desc: Install the pinned Trivy.
    status:
      - "test -x {{.TOOLS_BIN}}/trivy && {{.TOOLS_BIN}}/trivy --version | grep -q \"Version: $(versions version trivy)$\""
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch trivy {{.DOWNLOADS}}) && tar -xzf "$f" -C {{.TOOLS_BIN}} trivy

  tools:terraform-docs:
    desc: Install the pinned terraform-docs.
    status:
      - test -x {{.TOOLS_BIN}}/terraform-docs && {{.TOOLS_BIN}}/terraform-docs --version | grep -q "v$(versions version terraform-docs) "
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch terraform-docs {{.DOWNLOADS}}) && tar -xzf "$f" -C {{.TOOLS_BIN}} terraform-docs

  tools:shellcheck:
    desc: Install the pinned ShellCheck.
    status:
      - "test -x {{.TOOLS_BIN}}/shellcheck && {{.TOOLS_BIN}}/shellcheck --version | grep -q \"^version: $(versions version shellcheck)$\""
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch shellcheck {{.DOWNLOADS}}) && tar -xJf "$f" -C {{.TOOLS_BIN}} --strip-components=1 --wildcards '*/shellcheck'

  tools:cosign:
    desc: Install the pinned cosign.
    status:
      - test -x {{.TOOLS_BIN}}/cosign && {{.TOOLS_BIN}}/cosign version 2>&1 | grep -q "GitVersion:.*v$(versions version cosign)$"
    cmds:
      - f=$(versions fetch cosign {{.DOWNLOADS}}) && install -D -m 755 "$f" {{.TOOLS_BIN}}/cosign

  tools:oras:
    desc: Install the pinned ORAS.
    status:
      - "test -x {{.TOOLS_BIN}}/oras && {{.TOOLS_BIN}}/oras version | grep -q \"^Version: *$(versions version oras)$\""
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch oras {{.DOWNLOADS}}) && tar -xzf "$f" -C {{.TOOLS_BIN}} oras

  tools:d2:
    desc: Install the pinned D2.
    status:
      - test -x {{.TOOLS_BIN}}/d2 && {{.TOOLS_BIN}}/d2 --version | grep -q "^v$(versions version d2)$"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - f=$(versions fetch d2 {{.DOWNLOADS}}) && tar -xzf "$f" -C {{.TOOLS_BIN}} --strip-components=2 --wildcards '*/bin/d2'

  docs:
    desc: Write each module's inputs and outputs into its README.
    deps: [tools:terraform-docs]
    cmds:
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml {{.ITEM}}"

  diagrams:
    desc: Render docs/diagrams/*.d2 into the SVGs beside them, the icons inside each.
    deps: [tools:d2]
    cmds:
      # D2 embeds each icon whole, base64 and once per use: as AWS and simple-icons ship them,
      # they made installation.svg 145 kB. An icon svgo has already rewritten comes out the same.
      - sfw pnpm dlx "svgo@$(versions version svgo)" -q --config docs/diagrams/svgo.config.mjs -f docs/diagrams/icons
      - >-
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        {{.TOOLS_BIN}}/d2 {{.D2_FLAGS}} "$d" "${d%.d2}.svg" >/dev/null || exit 1; done

  # A picture nothing in a build reads is the one that drifts unnoticed: each SVG is rendered again
  # and has to be the one committed, byte for byte (D2 lays out the same source the same way).
  # Under 100 kB, the size past which a crawl of docs.spinbox.dev flags an image.
  diagrams:check:
    desc: Fail when a committed SVG is not what its .d2 renders to, or is 100 kB or more.
    deps: [tools:d2]
    cmds:
      - >-
        tmp=$(mktemp -d); trap 'rm -rf $tmp' EXIT;
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        {{.TOOLS_BIN}}/d2 {{.D2_FLAGS}} "$d" "$tmp/$(basename ${d%.d2}).svg" >/dev/null || exit 1;
        cmp -s "$tmp/$(basename ${d%.d2}).svg" "${d%.d2}.svg" || { echo "${d%.d2}.svg is not what $d renders to: go tool task diagrams"; exit 1; };
        [ "$(wc -c <"${d%.d2}.svg")" -lt 100000 ] || { echo "${d%.d2}.svg is 100 kB or more"; exit 1; }; done

  lint:
    desc: Format-check, validate, lint and scan the modules, the examples and bootstrap, and hold each module to its tests.
    deps: [tools:tofu, tools:tflint, tools:trivy, tools:terraform-docs, tools:shellcheck, bin]
    # Nothing else parses these, and nothing runs them but an apply against an account - so a
    # module that stopped validating is found by the operator it was written for. The provider
    # is the one each lock file pins, cached under .tools so a second run downloads nothing.
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tools/tofu-plugins"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tools/tofu-plugins
      - "{{.TOOLS_BIN}}/tofu fmt -recursive -check -diff"
      - task: lint:workflows
      # Every workflow step one task, so what CI does is what a task here does, and go-tools'
      # common tasks as every repository has them; and no package installed but by pnpm through
      # Socket's firewall. The scripts that are programs are listed, as work owed.
      - taskgate -common -allow .github/taskgate-allow.txt -task {{.TASK_EXE}}
      - sfw check
      # A test that writes git's author into the checkout makes every commit after it the test's;
      # this refuses those commits before they reach main.
      - testidentity -base origin/main
      - "{{.TOOLS_BIN}}/shellcheck hack/*.sh"
      # spin-aws-dev, and hack/enroll, which only the fresh install's smoke runs, with go run.
      - test -z "$(gofmt -l hack/enroll cmd)" || { gofmt -l hack/enroll cmd; echo 'gofmt -w hack/enroll cmd'; exit 1; }
      - go vet ./...
      # The fresh install's posture filters among them (hack/posture), which only that run feeds a
      # real account's answers.
      - go test ./...
      - bash hack/security-group-descriptions.sh $(find modules -name '*.tf')
      - for: ['.', examples/complete, examples/minimal, bootstrap]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} validate -no-color"
      # The order a destroy has to happen in, which nothing else would see before the fresh install.
      - '{{.SPIN_AWS_DEV}} destroy-order {{.TOOLS_BIN}}/tofu .'
      # What validate does not know (.tflint.hcl), against one configuration for every directory:
      # an absolute path, since a relative one is looked for in each directory it walks into.
      - "{{.TOOLS_BIN}}/tflint --init --config={{.ROOT_DIR}}/.tflint.hcl >/dev/null"
      - "{{.TOOLS_BIN}}/tflint --recursive --config={{.ROOT_DIR}}/.tflint.hcl --format compact"
      # AWS's misconfigurations, each one this installation decides against ignored at its
      # resource with the reason (#trivy:ignore), so a new one fails here.
      - "{{.TOOLS_BIN}}/trivy config --quiet --exit-code 1 --cache-dir {{.ROOT_DIR}}/.tools/trivy-cache --skip-dirs .tools ."
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml --output-check {{.ITEM}} >/dev/null || { echo '{{.ITEM}}/README.md is not what its variables and outputs say: go tool task docs'; exit 1; }"
      - task: diagrams:check
      # What each module promises about who reaches what - the proxy the only machine the
      # internet reaches, no role able to write IAM or read another's secrets, every disk
      # encrypted - asserted against its plan, with no account.
      - for: [modules/controlplane, modules/runners, bootstrap]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} test -no-color"

  # The fresh install's steps (.github/workflows/fresh-install.yml), each against the account the
  # run assumed: run here, they need its credentials and the variables the workflow sets.
  fresh-install:tools:
    desc: Install what the fresh install runs, and put it on the run's PATH.
    cmds:
      - task: tools:tofu
      - task: tools:cosign
      - task: tools:oras
      - echo '{{.TOOLS_BIN}}' >> "${GITHUB_PATH:-/dev/stdout}"

  fresh-install:
    desc: >-
      Run one step of the fresh install: go tool task fresh-install -- release|cli|cost|domain|bootstrap|installation|delegate|undelegate|wait-machines|sign-in|smoke|posture|host-check|why.
    cmds:
      - bash hack/fresh-install.sh {{.CLI_ARGS}}

  fresh-install:remove:
    desc: Remove the fresh install and its bootstrap, whatever a run left of them.
    cmds:
      - bash hack/fresh-install-remove.sh

  fresh-install:watch:
    desc: Remove what the fresh install left in the account, closing any issue once it is clean.
    deps: [bin]
    cmds:
      - '{{.SPIN_AWS_DEV}} fresh-install watch'

  fresh-install:watch:report:
    desc: Open an issue saying the watch did not finish, with what is still in the account.
    deps: [bin]
    cmds:
      - '{{.SPIN_AWS_DEV}} fresh-install watch --report'

  release:cut:
    desc: >-
      Cut this module's next release: GITHUB_SHA, once Gate passed on it, tagged v<YYYYMMDD>.<NN>,
      the next one today as go-tools' release names it, with its GitHub release and its notes in
      GITHUB_REPOSITORY, as GH_TOKEN (.github/workflows/release.yml).
    deps: [bin]
    cmds:
      - '{{.SPIN_AWS_DEV}} release'

  # spin-stack/ship-it reads this module's releases and the pull request propose.yml opens for a
  # deployment. GitHub's schedule does not wake it (its */5 ran 3 of 576 in 48 h), so the run that
  # cut the release or opened the pull request does. A hint: ship-it reads the state itself, and its
  # hourly cron catches a wake that was lost.
  ship-it:wake:
    desc: Wake spin-stack/ship-it with this run and its CONCLUSION, as GH_TOKEN (the release app's on ship-it; release.yml, propose.yml).
    requires:
      vars: [CONCLUSION]
    cmds:
      - |
        set -euo pipefail
        workflow=${GITHUB_WORKFLOW_REF%@*}
        gh api repos/spin-stack/ship-it/dispatches -f event_type=wake \
          -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
          -f "client_payload[workflow]=${workflow##*/}" \
          -f "client_payload[run]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          -f "client_payload[conclusion]=${CONCLUSION}"

  propose:
    desc: >-
      Propose this commit to a deployment: a pull request in REPOSITORY moving it to this ref and
      the newest release in REGION, as the app GH_TOKEN and APP_SLUG name.
    deps: [tools:tofu, bin]
    env:
      TOFU: "{{.TOOLS_BIN}}/tofu"
    cmds:
      - '{{.SPIN_AWS_DEV}} propose'
