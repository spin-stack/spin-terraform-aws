version: '3'

vars:
  TOOLS_BIN: '{{.ROOT_DIR}}/.tools/bin'
  # Each tool is a release archive checked against this digest: the one in the release's own
  # checksums file.
  TOFU_VERSION: 1.12.6
  TOFU_SHA256: 5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8
  TFLINT_VERSION: 0.64.0
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  TFDOCS_VERSION: 0.24.0
  TFDOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
  # The version spin's versions.yaml pins: nothing else reads a workflow before GitHub runs it.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # The shell in hack/ and in each workflow's steps (actionlint asks it). Its release has no
  # checksums file: this is the archive's digest as first downloaded.
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  # What the fresh install fetches spin's CLI with, from the release's public package, and checks it
  # by. Cosign's release is the binary itself, its digest the one in cosign_checksums.txt.
  COSIGN_VERSION: 3.1.3
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  ORAS_VERSION: 1.3.4
  ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
  # The modules whose inputs and outputs terraform-docs writes into their README.
  DOCUMENTED: modules/controlplane modules/runners
  # spin-stack/go-tools' gates, by commit: this repository has no go.mod to pin them as tools.
  GO_TOOLS_VERSION: dfcf2c10f30b2b2c65cea37558cbf12881f8fde9
  # D2, the version spin-stack/ami pins, and its flags there: one light theme, each diagram its own
  # size. Its release's own build rather than its image: the image came from Docker Hub, which
  # GitHub's runners could not reach for a token on 2026-10-09, and failed every lint with it. The
  # release renders the committed SVGs byte for byte as that image did.
  # docs/diagrams/icons are taken from the packages that repository pins (versions.yaml there:
  # aws-architecture-icons 07312026, simple-icons 16.33.0), checked against its digests.
  D2_VERSION: 0.9.0
  D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
  D2_FLAGS: >-
    --layout elk --elk-nodeNodeBetweenLayers 56 --elk-edgeNodeBetweenLayers 20
    --elk-padding '[top=40,left=24,bottom=24,right=24]' --theme 0 --pad 16 --scale 1

tasks:
  tools:tofu:
    desc: Install the pinned OpenTofu.
    status:
      - test -x {{.TOOLS_BIN}}/tofu && {{.TOOLS_BIN}}/tofu version | grep -q 'v{{.TOFU_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/tofu.zip https://github.com/opentofu/opentofu/releases/download/v{{.TOFU_VERSION}}/tofu_{{.TOFU_VERSION}}_linux_amd64.zip
      - echo "{{.TOFU_SHA256}}  {{.TOOLS_BIN}}/tofu.zip" | sha256sum --check --quiet
      - unzip -oq {{.TOOLS_BIN}}/tofu.zip tofu -d {{.TOOLS_BIN}}
      - rm {{.TOOLS_BIN}}/tofu.zip

  tools:tflint:
    desc: Install the pinned TFLint.
    status:
      - test -x {{.TOOLS_BIN}}/tflint && {{.TOOLS_BIN}}/tflint --version | grep -q 'version {{.TFLINT_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v{{.TFLINT_VERSION}}/tflint_linux_amd64.zip
      - echo "{{.TFLINT_SHA256}}  {{.TOOLS_BIN}}/tflint.zip" | sha256sum --check --quiet
      - unzip -oq {{.TOOLS_BIN}}/tflint.zip tflint -d {{.TOOLS_BIN}}
      - rm {{.TOOLS_BIN}}/tflint.zip

  tools:trivy:
    desc: Install the pinned Trivy.
    status:
      - "test -x {{.TOOLS_BIN}}/trivy && {{.TOOLS_BIN}}/trivy --version | grep -q 'Version: {{.TRIVY_VERSION}}$'"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v{{.TRIVY_VERSION}}/trivy_{{.TRIVY_VERSION}}_Linux-64bit.tar.gz
      - echo "{{.TRIVY_SHA256}}  {{.TOOLS_BIN}}/trivy.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/trivy.tgz -C {{.TOOLS_BIN}} trivy
      - rm {{.TOOLS_BIN}}/trivy.tgz

  tools:terraform-docs:
    desc: Install the pinned terraform-docs.
    status:
      - test -x {{.TOOLS_BIN}}/terraform-docs && {{.TOOLS_BIN}}/terraform-docs --version | grep -q 'v{{.TFDOCS_VERSION}} '
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/terraform-docs.tgz https://github.com/terraform-docs/terraform-docs/releases/download/v{{.TFDOCS_VERSION}}/terraform-docs-v{{.TFDOCS_VERSION}}-linux-amd64.tar.gz
      - echo "{{.TFDOCS_SHA256}}  {{.TOOLS_BIN}}/terraform-docs.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/terraform-docs.tgz -C {{.TOOLS_BIN}} terraform-docs
      - rm {{.TOOLS_BIN}}/terraform-docs.tgz

  tools:actionlint:
    desc: Install the pinned actionlint.
    status:
      - test -x {{.TOOLS_BIN}}/actionlint && {{.TOOLS_BIN}}/actionlint -version | grep -q '^{{.ACTIONLINT_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v{{.ACTIONLINT_VERSION}}/actionlint_{{.ACTIONLINT_VERSION}}_linux_amd64.tar.gz
      - echo "{{.ACTIONLINT_SHA256}}  {{.TOOLS_BIN}}/actionlint.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/actionlint.tgz -C {{.TOOLS_BIN}} actionlint
      - rm {{.TOOLS_BIN}}/actionlint.tgz

  tools:shellcheck:
    desc: Install the pinned ShellCheck.
    status:
      - "test -x {{.TOOLS_BIN}}/shellcheck && {{.TOOLS_BIN}}/shellcheck --version | grep -q '^version: {{.SHELLCHECK_VERSION}}$'"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/shellcheck.txz https://github.com/koalaman/shellcheck/releases/download/v{{.SHELLCHECK_VERSION}}/shellcheck-v{{.SHELLCHECK_VERSION}}.linux.x86_64.tar.xz
      - echo "{{.SHELLCHECK_SHA256}}  {{.TOOLS_BIN}}/shellcheck.txz" | sha256sum --check --quiet
      - tar -xJf {{.TOOLS_BIN}}/shellcheck.txz -C {{.TOOLS_BIN}} --strip-components=1 shellcheck-v{{.SHELLCHECK_VERSION}}/shellcheck
      - rm {{.TOOLS_BIN}}/shellcheck.txz

  tools:cosign:
    desc: Install the pinned cosign.
    status:
      - test -x {{.TOOLS_BIN}}/cosign && {{.TOOLS_BIN}}/cosign version 2>&1 | grep -q 'GitVersion:.*v{{.COSIGN_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/cosign.new https://github.com/sigstore/cosign/releases/download/v{{.COSIGN_VERSION}}/cosign-linux-amd64
      - echo "{{.COSIGN_SHA256}}  {{.TOOLS_BIN}}/cosign.new" | sha256sum --check --quiet
      - chmod +x {{.TOOLS_BIN}}/cosign.new && mv {{.TOOLS_BIN}}/cosign.new {{.TOOLS_BIN}}/cosign

  tools:oras:
    desc: Install the pinned ORAS.
    status:
      - "test -x {{.TOOLS_BIN}}/oras && {{.TOOLS_BIN}}/oras version | grep -q '^Version: *{{.ORAS_VERSION}}$'"
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/oras.tgz https://github.com/oras-project/oras/releases/download/v{{.ORAS_VERSION}}/oras_{{.ORAS_VERSION}}_linux_amd64.tar.gz
      - echo "{{.ORAS_SHA256}}  {{.TOOLS_BIN}}/oras.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/oras.tgz -C {{.TOOLS_BIN}} oras
      - rm {{.TOOLS_BIN}}/oras.tgz

  tools:d2:
    desc: Install the pinned D2.
    status:
      - test -x {{.TOOLS_BIN}}/d2 && {{.TOOLS_BIN}}/d2 --version | grep -q '^v{{.D2_VERSION}}$'
    cmds:
      - mkdir -p {{.TOOLS_BIN}}
      - curl -fsSLo {{.TOOLS_BIN}}/d2.tgz https://github.com/terrastruct/d2/releases/download/v{{.D2_VERSION}}/d2-v{{.D2_VERSION}}-linux-amd64.tar.gz
      - echo "{{.D2_SHA256}}  {{.TOOLS_BIN}}/d2.tgz" | sha256sum --check --quiet
      - tar -xzf {{.TOOLS_BIN}}/d2.tgz -C {{.TOOLS_BIN}} --strip-components=2 d2-v{{.D2_VERSION}}/bin/d2
      - rm {{.TOOLS_BIN}}/d2.tgz

  docs:
    desc: Write each module's inputs and outputs into its README.
    deps: [tools:terraform-docs]
    cmds:
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml {{.ITEM}}"

  diagrams:
    desc: Render docs/diagrams/*.d2 into the SVGs beside them, the icons inside each.
    deps: [tools:d2]
    cmds:
      - >-
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        {{.TOOLS_BIN}}/d2 {{.D2_FLAGS}} "$d" "${d%.d2}.svg" >/dev/null || exit 1; done

  # A picture nothing in a build reads is the one that drifts unnoticed: each SVG is rendered again
  # and has to be the one committed, byte for byte (D2 lays out the same source the same way).
  diagrams:check:
    desc: Fail when a committed SVG is not what its .d2 renders to.
    deps: [tools:d2]
    cmds:
      - >-
        tmp=$(mktemp -d); trap 'rm -rf $tmp' EXIT;
        for d in docs/diagrams/*.d2; do case $d in */_*) continue;; esac;
        {{.TOOLS_BIN}}/d2 {{.D2_FLAGS}} "$d" "$tmp/$(basename ${d%.d2}).svg" >/dev/null || exit 1;
        cmp -s "$tmp/$(basename ${d%.d2}).svg" "${d%.d2}.svg" || { echo "${d%.d2}.svg is not what $d renders to: task diagrams"; exit 1; }; done

  lint:
    desc: Format-check, validate, lint and scan the modules, the examples and bootstrap, and hold each module to its tests.
    deps: [tools:tofu, tools:tflint, tools:trivy, tools:terraform-docs, tools:actionlint, tools:shellcheck]
    # Nothing else parses these, and nothing runs them but an apply against an account - so a
    # module that stopped validating is found by the operator it was written for. The provider
    # is the one each lock file pins, cached under .tools so a second run downloads nothing.
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.tools/tofu-plugins"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tools/tofu-plugins
      - "{{.TOOLS_BIN}}/tofu fmt -recursive -check -diff"
      # The pinned shellcheck, named: given none, actionlint takes whichever is on PATH, or skips.
      - "{{.TOOLS_BIN}}/actionlint -shellcheck={{.TOOLS_BIN}}/shellcheck"
      # Every workflow step one task, so what CI does is what a task here does; and no package
      # installed but by pnpm through Socket's firewall.
      - go run github.com/spin-stack/go-tools/cmd/taskgate@{{.GO_TOOLS_VERSION}}
      - go run github.com/spin-stack/go-tools/cmd/sfw@{{.GO_TOOLS_VERSION}} check
      - "{{.TOOLS_BIN}}/shellcheck hack/*.sh"
      - bash hack/security-group-descriptions.sh $(find modules -name '*.tf')
      - for: ['.', examples/complete, examples/minimal, bootstrap]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} validate -no-color"
      # The order a destroy has to happen in, which nothing else would see before the fresh install.
      - bash hack/destroy-order.sh {{.TOOLS_BIN}}/tofu .
      # What validate does not know (.tflint.hcl), against one configuration for every directory:
      # an absolute path, since a relative one is looked for in each directory it walks into.
      - "{{.TOOLS_BIN}}/tflint --init --config={{.ROOT_DIR}}/.tflint.hcl >/dev/null"
      - "{{.TOOLS_BIN}}/tflint --recursive --config={{.ROOT_DIR}}/.tflint.hcl --format compact"
      # AWS's misconfigurations, each one this installation decides against ignored at its
      # resource with the reason (#trivy:ignore), so a new one fails here.
      - "{{.TOOLS_BIN}}/trivy config --quiet --exit-code 1 --cache-dir {{.ROOT_DIR}}/.tools/trivy-cache --skip-dirs .tools ."
      - for: {var: DOCUMENTED, split: ' '}
        cmd: "{{.TOOLS_BIN}}/terraform-docs -c .terraform-docs.yml --output-check {{.ITEM}} >/dev/null || { echo '{{.ITEM}}/README.md is not what its variables and outputs say: task docs'; exit 1; }"
      - task: diagrams:check
      # What each module promises about who reaches what - the proxy the only machine the
      # internet reaches, no role able to write IAM or read another's secrets - asserted
      # against its plan, with no account.
      - for: [modules/controlplane, modules/runners]
        cmd: "{{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} init -backend=false -lockfile=readonly -input=false -no-color >/dev/null && {{.TOOLS_BIN}}/tofu -chdir={{.ITEM}} test -no-color"

  # The fresh install's steps (.github/workflows/fresh-install.yml), each against the account the
  # run assumed: run here, they need its credentials and the variables the workflow sets.
  fresh-install:tools:
    desc: Install what the fresh install runs, and put it on the run's PATH.
    cmds:
      - task: tools:tofu
      - task: tools:cosign
      - task: tools:oras
      - echo '{{.TOOLS_BIN}}' >> "${GITHUB_PATH:-/dev/stdout}"

  fresh-install:
    desc: >-
      Run one step of the fresh install: task fresh-install -- release|cli|cost|domain|bootstrap|installation|delegate|undelegate|wait-machines|sign-in|smoke|why.
    cmds:
      - bash hack/fresh-install.sh {{.CLI_ARGS}}

  fresh-install:remove:
    desc: Remove the fresh install and its bootstrap, whatever a run left of them.
    cmds:
      - bash hack/fresh-install-remove.sh

  fresh-install:watch:
    desc: Remove what the fresh install left in the account, and open an issue for what it cannot.
    cmds:
      - bash hack/fresh-install-watch.sh

  release:
    desc: >-
      Cut this module's next release: GITHUB_SHA, once Gate passed on it, tagged v<YYYYMMDD>.<NN>,
      the next one today, with its GitHub release in GITHUB_REPOSITORY, as GH_TOKEN
      (.github/workflows/release.yml).
    cmds:
      - bash hack/release.sh

  propose:
    desc: >-
      Propose this commit to a deployment: a pull request in REPOSITORY moving it to this ref and
      the newest release in REGION, as the app GH_TOKEN and APP_SLUG name.
    cmds:
      - bash hack/propose.sh
