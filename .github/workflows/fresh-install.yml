# An installation made from nothing, signed in to and removed, once a week: bootstrap/ and
# examples/complete applied as the README says, in an account of their own, then everything
# destroyed whatever happened. task lint plans nothing against an account, and an installation
# that only ever updates never runs a first boot, an empty database, a first certificate or the
# README's removal.
#
# What the account has before the first run, made by whoever made the account, since nothing here
# may make the role it runs as:
#
#   - GitHub's OIDC provider and a role this workflow assumes, AdministratorAccess (an
#     installation makes most of an account) and a maximum session of at least two hours, trusting
#     only the subject of this repository's `fresh-install` environment on main
#     (bootstrap/github.tf has the subject's form). Its ARN is the variable FRESH_INSTALL_ROLE.
#   - A public Route 53 zone the account already has, whose id is FRESH_INSTALL_ZONE_ID: each run
#     installs on r<run>.qa.<zone> and delegates it there, so the proxy's certificate is a real one.
#     No zone is kept for this: the run's own is deleted within the 12 hours Route 53 does not bill.
#   - Launch permission on the release's images in us-east-1, and on their snapshots: spin-stack/ami
#     registers them in its own account.
#   - Nothing else, and nothing of spin: each run makes the state's KMS key and bucket and the three
#     Secure Boot keys (bootstrap/), and removes them when it ends, every key scheduled for
#     deletion. Nobody cleans the account by hand: hack/fresh-install-remove.sh is the removal, run
#     at the end of a run and again at the start of the next, which finishes whatever the one before
#     left - an installation still in bootstrap's bucket, the bucket, the aliases. Bootstrap is kept
#     only while the installation's state still has something, since that state is what finds it.
name: Fresh install

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

concurrency:
  group: fresh-install
  cancel-in-progress: false

permissions:
  contents: read

# us-east-1, named for both, and never the modules' us-west-2 default: that is where the development
# installation lives, and an install from nothing beside it would share its region's quotas and
# hide a dependency on what it left there.
env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_region: us-east-1
  TF_VAR_name: fresh

jobs:
  install:
    runs-on: ubuntu-latest
    environment: fresh-install
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Tools
        run: |
          task tools:tofu tools:cosign tools:oras
          echo "${GITHUB_WORKSPACE}/.tools/bin" >> "${GITHUB_PATH}"

      # The newest release this commit can install in the region: an image of every role and its
      # measurements. None is a failure: main installs nothing. spin-stack/ami's release publishes
      # in the regions its release.yml names, which must include this one.
      - name: Release
        run: |
          set -euo pipefail
          release=$(jq -r --arg r "${AWS_REGION}" --slurpfile m measurements.json '[to_entries[] | .key as $v | .value as $img
            | select(all("control-plane", "runner", "proxy"; $img[.][$r] and ($m[0][$v][.] // {} | length > 0))) | $v] | sort | last // empty' images.json)
          if [ -z "${release}" ]; then
            echo "::error::images.json and measurements.json have no release with every role's image and measurements in ${AWS_REGION}: a release must be published in ${AWS_REGION} by spin-stack/ami (release.yml)"; exit 1
          fi
          echo "TF_VAR_spin_version=${release}" >> "${GITHUB_ENV}"

      # The CLI of the release installed, from its public package, checked as docs/releases.md in
      # spin checks a file: signed by release.yml at main, and its provenance naming this release.
      # Before anything is made, so a release whose CLI does not check costs no installation.
      - name: CLI
        id: cli
        env:
          IDENTITY: https://github.com/spin-stack/spin/.github/workflows/release.yml@refs/heads/main
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/cli"
          oras pull --no-tty -o "${dir}" "ghcr.io/spin-stack/spin-release:${TF_VAR_spin_version}-spin-linux-amd64"
          cosign verify-blob --bundle "${dir}/spin-linux-amd64.sigstore.json" --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" "${dir}/spin-linux-amd64"
          cosign verify-blob-attestation --type slsaprovenance1 --bundle "${dir}/spin-linux-amd64.provenance.sigstore.json" \
            --digest "$(sha256sum "${dir}/spin-linux-amd64" | cut -d' ' -f1)" --digestAlg sha256 \
            --certificate-identity "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}"
          built=$(jq -r .dsseEnvelope.payload "${dir}/spin-linux-amd64.provenance.sigstore.json" | base64 -d |
            jq -r .predicate.buildDefinition.externalParameters.version)
          if [ "${built}" != "${TF_VAR_spin_version}" ]; then
            echo "::error::spin-linux-amd64 of ${TF_VAR_spin_version} says it was built as ${built}"; exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 755 "${dir}/spin-linux-amd64" "${RUNNER_TEMP}/bin/spin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          # Only while the newest release images.json names predates `spin smoke` (v20261015.01 did,
          # when this was written): an older CLI's `smoke --help` is its root's help, exit 0. Once
          # one that has it is merged, a CLI without it is a failure and this goes.
          usage=$("${RUNNER_TEMP}/bin/spin" smoke --help)
          if grep -q '^  spin smoke ' <<< "${usage}"; then
            echo "smoke=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::spin ${TF_VAR_spin_version} has no 'spin smoke': the installation is signed in to and not used"
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.FRESH_INSTALL_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Domain
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          set -euo pipefail
          zone=$(aws route53 get-hosted-zone --id "${ZONE_ID}" --query HostedZone.Name --output text)
          echo "TF_VAR_domain=r${GITHUB_RUN_NUMBER}.qa.${zone%.}" >> "${GITHUB_ENV}"

      # What a run before this one left - cancelled, or its removal refused - removed before anything
      # is made, by the removal that runs at the end: bootstrap's apply refuses a bucket or an alias
      # that is already there. One that cannot finish stops the run with nothing of its own made.
      - name: Sweep
        timeout-minutes: 60
        run: bash hack/fresh-install-remove.sh

      - name: Bootstrap
        id: bootstrap
        working-directory: bootstrap
        run: |
          tofu init -lockfile=readonly
          tofu apply -auto-approve

      - name: Install
        id: install
        working-directory: examples/complete
        run: |
          $(tofu -chdir=../../bootstrap output -raw init) -lockfile=readonly
          tofu apply -auto-approve

      - name: Delegate the domain
        id: delegate
        working-directory: examples/complete
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          set -euo pipefail
          jq -n --arg d "${TF_VAR_domain}" --argjson ns "$(tofu output -json name_servers)" \
            '{Changes: [{Action: "UPSERT", ResourceRecordSet: {Name: $d, Type: "NS", TTL: 60, ResourceRecords: [$ns[] | {Value: .}]}}]}' \
            > "${RUNNER_TEMP}/delegation.json"
          aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" --change-batch "file://${RUNNER_TEMP}/delegation.json"

      # The launch hook puts a machine in service only once its boot says it is up. A first install
      # has no refresh, so update_status has nothing to say until a second apply.
      - name: Wait for the machines
        working-directory: examples/complete
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for group in $(tofu output -json update_status | jq -r 'keys[]'); do
            until aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${group}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService']" --output text | grep -q .; do
              sleep 30
            done
            echo "${group} is in service"
          done

      # The first sign-in as a person makes it: the one-time password from SSM, over the proxy's
      # certificate, to the control plane. Retried while the delegation spreads and the certificate
      # is issued; curl refuses until there is a valid one. The session is kept, in a file, for the
      # smoke: a session is the person, every procedure an API key's scopes would name included.
      - name: First sign-in
        working-directory: examples/complete
        timeout-minutes: 30
        run: |
          set -euo pipefail
          umask 077
          sign_in=$(tofu output -json first_sign_in)
          password=$(eval "$(jq -r .password <<< "${sign_in}")")
          echo "::add-mask::${password}"
          jq -n --arg e "$(jq -r .user <<< "${sign_in}")" --arg p "${password}" '{email: $e, password: $p}' > "${RUNNER_TEMP}/login.json"
          endpoint=$(jq -r .url <<< "${sign_in}")
          until curl -fsS -o "${RUNNER_TEMP}/session.json" -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/login.json" \
            "${endpoint}/spin.v1.SetupService/PasswordLogin"; do
            sleep 30
          done
          token=$(jq -r '.sessionToken // empty' "${RUNNER_TEMP}/session.json")
          [ -n "${token}" ]
          echo "::add-mask::${token}"
          printf '%s' "${token}" > "${RUNNER_TEMP}/session-token"
          echo "SPIN_ENDPOINT=${endpoint}" >> "${GITHUB_ENV}"
          force=$(jq -r '.forcePasswordChange // false' "${RUNNER_TEMP}/session.json")
          echo "signed in; force_password_change: ${force}"
          # A session opened with the one-time password may only change it (whileChangingThePassword
          # in spin), so it is changed, to one nobody needs again: the session stays, the others go.
          # An upper, a lower and a digit, as the control plane's strength check asks.
          if [ "${force}" = true ]; then
            fresh="Aa1$(openssl rand -hex 24)"
            echo "::add-mask::${fresh}"
            jq -n --arg c "${password}" --arg n "${fresh}" '{currentPassword: $c, newPassword: $n}' > "${RUNNER_TEMP}/change.json"
            printf 'Authorization: Bearer %s\n' "${token}" > "${RUNNER_TEMP}/bearer"
            curl -fsS -o /dev/null -H 'Content-Type: application/json' -H "@${RUNNER_TEMP}/bearer" \
              --data-binary "@${RUNNER_TEMP}/change.json" "${endpoint}/spin.v1.SetupService/ChangePassword"
            rm "${RUNNER_TEMP}/change.json" "${RUNNER_TEMP}/bearer"
          fi
          rm "${RUNNER_TEMP}/login.json" "${RUNNER_TEMP}/session.json"

      # The contract as a person meets it, with a key of their own: registered, their keyring signed
      # with it, and `spin smoke` - a workspace made, run in, kept from the cloud's metadata,
      # suspended and resumed, erased. Its egress root is pinned on first use, as anybody's is. The
      # runner group starts at none, and its first machine is a spot one booting: hence the time.
      - name: Smoke
        if: steps.cli.outputs.smoke == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/spin-home"
          SPIN_TOKEN=$(cat "${RUNNER_TEMP}/session-token")
          export SPIN_TOKEN
          mkdir -m 700 "${HOME}" "${HOME}/.ssh"
          ssh-keygen -q -t ed25519 -N '' -C fresh-install -f "${HOME}/.ssh/id_ed25519"
          spin ssh-key add fresh-install "${HOME}/.ssh/id_ed25519.pub"
          spin sign --yes
          status=0
          spin -o json smoke --timeout 20m > "${RUNNER_TEMP}/smoke.json" || status=$?
          jq . "${RUNNER_TEMP}/smoke.json" || cat "${RUNNER_TEMP}/smoke.json"
          if [ "${status}" -ne 0 ]; then
            failed=$(jq -r '[.steps[]? | select(.error) | .step] | join(", ")' "${RUNNER_TEMP}/smoke.json" 2> /dev/null || true)
            case "${status}" in
              69) why="the installation did not answer" ;;
              70) why="a scenario failed: ${failed}" ;;
              77) why="the session was refused" ;;
              *) why="it could not run as configured" ;;
            esac
            echo "::error::spin smoke exited ${status}: ${why}"
            exit "${status}"
          fi

      - name: Why
        if: failure() && steps.install.outcome != 'skipped'
        working-directory: examples/complete
        run: |
          tofu output -json boot_log | jq -r '.[] | rtrimstr(" --follow")' | while read -r cmd; do eval "${cmd}" || true; done
          tofu output -json update_status | jq -r '.[]' | while read -r cmd; do eval "${cmd}" || true; done

      # Everything below runs whatever happened above, on credentials of its own: the ones above may
      # have run out while a step waited.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always() && steps.bootstrap.outcome != 'skipped'
        with:
          role-to-assume: ${{ vars.FRESH_INSTALL_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Remove the delegation
        if: always() && steps.delegate.outcome == 'success'
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          jq '.Changes[0].Action = "DELETE"' "${RUNNER_TEMP}/delegation.json" > "${RUNNER_TEMP}/undelegation.json"
          aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" --change-batch "file://${RUNNER_TEMP}/undelegation.json"

      # The removal the run began with (Sweep), on what this one made: the installation as the
      # README removes it, what still carries its tag, and bootstrap once the installation's state
      # is empty - however far the install got and whatever fails on the way.
      - name: Remove everything
        if: always() && steps.bootstrap.outcome != 'skipped'
        timeout-minutes: 60
        run: bash hack/fresh-install-remove.sh
