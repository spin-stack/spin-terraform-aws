# An installation made from nothing, signed in to and removed, once a week: bootstrap/ and
# examples/complete applied as the README says, in an account of their own, then everything
# destroyed whatever happened. task lint plans nothing against an account, and an installation
# that only ever updates never runs a first boot, an empty database, a first certificate or the
# README's removal.
#
# What the account has before the first run, made by whoever made the account, since nothing here
# may make the role it runs as:
#
#   - GitHub's OIDC provider and a role this workflow assumes, AdministratorAccess (an
#     installation makes most of an account) and a maximum session of at least two hours, trusting
#     only the subject of this repository's `fresh-install` environment on main
#     (bootstrap/github.tf has the subject's form). Its ARN is the variable FRESH_INSTALL_ROLE.
#   - A public Route 53 zone delegated from its parent, whose id is FRESH_INSTALL_ZONE_ID: each run
#     installs on r<run>.<zone> and delegates it there, so the proxy's certificate is a real one.
#   - Launch permission on the release's images, and on their snapshots: spin-stack/ami registers
#     them in its own account.
#   - Nothing else, and nothing of spin: each run makes the state's KMS key and bucket and the three
#     Secure Boot keys (bootstrap/), and schedules every key it made for deletion when it ends. A run
#     that finds bootstrap's bucket or aliases already there stops at its first apply: the run
#     before it did not finish, and its teardown's log says what is left.
name: Fresh install

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

concurrency:
  group: fresh-install
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_region: us-west-2
  TF_VAR_name: fresh

jobs:
  install:
    runs-on: ubuntu-latest
    environment: fresh-install
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Tools
        run: |
          task tools:tofu
          echo "${GITHUB_WORKSPACE}/.tools/bin" >> "${GITHUB_PATH}"

      # The newest release this commit can install in the region: an image of every role and its
      # measurements. None is a failure: main installs nothing.
      - name: Release
        run: |
          set -euo pipefail
          release=$(jq -r --arg r "${AWS_REGION}" --slurpfile m measurements.json '[to_entries[] | .key as $v | .value as $img
            | select(all("control-plane", "runner", "proxy"; $img[.][$r] and ($m[0][$v][.] // {} | length > 0))) | $v] | sort | last // empty' images.json)
          if [ -z "${release}" ]; then
            echo "::error::images.json and measurements.json have no release with every role's image and measurements in ${AWS_REGION}"; exit 1
          fi
          echo "TF_VAR_spin_version=${release}" >> "${GITHUB_ENV}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.FRESH_INSTALL_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Domain
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          set -euo pipefail
          zone=$(aws route53 get-hosted-zone --id "${ZONE_ID}" --query HostedZone.Name --output text)
          echo "TF_VAR_domain=r${GITHUB_RUN_NUMBER}.${zone%.}" >> "${GITHUB_ENV}"

      - name: Bootstrap
        id: bootstrap
        working-directory: bootstrap
        run: |
          tofu init -lockfile=readonly
          tofu apply -auto-approve

      - name: Install
        id: install
        working-directory: examples/complete
        run: |
          $(tofu -chdir=../../bootstrap output -raw init) -lockfile=readonly
          tofu apply -auto-approve

      - name: Delegate the domain
        id: delegate
        working-directory: examples/complete
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          set -euo pipefail
          jq -n --arg d "${TF_VAR_domain}" --argjson ns "$(tofu output -json name_servers)" \
            '{Changes: [{Action: "UPSERT", ResourceRecordSet: {Name: $d, Type: "NS", TTL: 60, ResourceRecords: [$ns[] | {Value: .}]}}]}' \
            > "${RUNNER_TEMP}/delegation.json"
          aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" --change-batch "file://${RUNNER_TEMP}/delegation.json"

      # The launch hook puts a machine in service only once its boot says it is up. A first install
      # has no refresh, so update_status has nothing to say until a second apply.
      - name: Wait for the machines
        working-directory: examples/complete
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for group in $(tofu output -json update_status | jq -r 'keys[]'); do
            until aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "${group}" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService']" --output text | grep -q .; do
              sleep 30
            done
            echo "${group} is in service"
          done

      # The first sign-in as a person makes it: the one-time password from SSM, over the proxy's
      # certificate, to the control plane. Retried while the delegation spreads and the certificate
      # is issued; curl refuses until there is a valid one.
      - name: First sign-in
        working-directory: examples/complete
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sign_in=$(tofu output -json first_sign_in)
          password=$(eval "$(jq -r .password <<< "${sign_in}")")
          echo "::add-mask::${password}"
          jq -n --arg e "$(jq -r .user <<< "${sign_in}")" --arg p "${password}" '{email: $e, password: $p}' > "${RUNNER_TEMP}/login.json"
          url="$(jq -r .url <<< "${sign_in}")/spin.v1.SetupService/PasswordLogin"
          until curl -fsS -o "${RUNNER_TEMP}/session.json" -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/login.json" "${url}"; do
            sleep 30
          done
          jq -e '.sessionToken | length > 0' "${RUNNER_TEMP}/session.json" > /dev/null
          echo "signed in; force_password_change: $(jq -r '.forcePasswordChange // false' "${RUNNER_TEMP}/session.json")"
          rm "${RUNNER_TEMP}/login.json" "${RUNNER_TEMP}/session.json"

      - name: Why
        if: failure() && steps.install.outcome != 'skipped'
        working-directory: examples/complete
        run: |
          tofu output -json boot_log | jq -r '.[] | rtrimstr(" --follow")' | while read -r cmd; do eval "${cmd}" || true; done
          tofu output -json update_status | jq -r '.[]' | while read -r cmd; do eval "${cmd}" || true; done

      # Everything below runs whatever happened above, on credentials of its own: the ones above may
      # have run out while a step waited.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: always() && steps.bootstrap.outcome != 'skipped'
        with:
          role-to-assume: ${{ vars.FRESH_INSTALL_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Remove the delegation
        if: always() && steps.delegate.outcome == 'success'
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: |
          jq '.Changes[0].Action = "DELETE"' "${RUNNER_TEMP}/delegation.json" > "${RUNNER_TEMP}/undelegation.json"
          aws route53 change-resource-record-sets --hosted-zone-id "${ZONE_ID}" --change-batch "file://${RUNNER_TEMP}/undelegation.json"

      # The README's removal, as an operator would run it: decommission applied to the buckets the
      # state has (an install that stopped halfway too), what refuses a destroy taken out of the
      # state, the destroy, and only then the keys scheduled for deletion - a destroy that failed
      # leaves them usable.
      - name: Remove the installation
        id: remove
        if: always() && steps.install.outcome != 'skipped'
        working-directory: examples/complete
        timeout-minutes: 60
        run: |
          set -euo pipefail
          printf 'module "spin" {\n  decommission = true\n}\n' > decommission_override.tf
          targets=$(tofu state list | grep -E '\.aws_s3_bucket(_policy)?\.[a-z]+(\[0\])?$' | sed 's/^/-target=/' || true)
          if [ -n "${targets}" ]; then
            # shellcheck disable=SC2086 # one -target= per word
            tofu apply -auto-approve ${targets}
          fi
          keys=$(tofu show -json | jq -r '.. | objects | select(.mode? == "managed" and .type? == "aws_kms_key") | .values.key_id')
          kept=$(tofu state list | grep -E '\.aws_kms_key\.|\.tls_(private_key|self_signed_cert)\.ca$' || true)
          # shellcheck disable=SC2086 # one address per word
          [ -z "${kept}" ] || tofu state rm ${kept}
          tofu destroy -auto-approve
          for id in ${keys}; do aws kms schedule-key-deletion --key-id "${id}" --pending-window-in-days 7 --query KeyId --output text; done

      # Only once the installation is gone: its state is in this bucket, and without it whatever a
      # failed destroy left is a person's to find by hand.
      - name: Remove bootstrap
        if: always() && steps.bootstrap.outcome != 'skipped' && (steps.remove.outcome == 'success' || steps.install.outcome == 'skipped')
        working-directory: bootstrap
        run: |
          set -euo pipefail
          bucket=$(tofu output -raw bucket)
          keys=$(tofu show -json | jq -r '.. | objects | select(.mode? == "managed" and .type? == "aws_kms_key") | .values.key_id')
          # shellcheck disable=SC2046 # one address per word
          tofu state rm aws_s3_bucket.state $(tofu state list | grep '^aws_kms_key\.')
          tofu destroy -auto-approve
          for id in ${keys}; do aws kms schedule-key-deletion --key-id "${id}" --pending-window-in-days 7 --query KeyId --output text; done
          aws s3api list-object-versions --bucket "${bucket}" --output json |
            jq '{Objects: [(.Versions // [])[], (.DeleteMarkers // [])[] | {Key, VersionId}], Quiet: true}' > "${RUNNER_TEMP}/versions.json"
          if jq -e '.Objects | length > 0' "${RUNNER_TEMP}/versions.json" > /dev/null; then
            aws s3api delete-objects --bucket "${bucket}" --delete "file://${RUNNER_TEMP}/versions.json"
          fi
          aws s3api delete-bucket --bucket "${bucket}"

      # The tagging API is behind a destroy by minutes, so what it still lists is said, not failed on.
      - name: Left behind
        if: always() && steps.install.outcome != 'skipped'
        run: |
          aws resourcegroupstaggingapi get-resources --tag-filters "Key=spin:installation,Values=${TF_VAR_name}" \
            --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' | grep -v ':kms:' | sed 's/^/::warning::left behind: /' || true
