# What main is now, proposed to each installation made from it: a pull request in its deployment
# repository that moves the module's ref to this commit and spin_version to the newest release
# images.json has an image of in that installation's region. One such pull request per
# deployment, rewritten by every push here, so what waits there is always the newest. A person
# reads its plan, merges it and applies; nothing here reaches an installation.
#
# As the release app (spin-stack-release), so the deployment's plan runs on the pull request: one
# opened with this run's own token would start none, and could not reach another repository.
name: propose

on:
  push:
    branches: [main]
    paths: ['**.tf', images.json]
  workflow_dispatch:

concurrency:
  group: propose
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Each installation made from this repository: where its deployment is, and its region.
        deployment:
          - {repository: spinbox.dev-deploy, region: us-west-2}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: ${{ matrix.deployment.repository }}

      - name: Propose this commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: spin-stack/${{ matrix.deployment.repository }}
          REGION: ${{ matrix.deployment.region }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          # The newest release with an image in the region: releases are v<YYYYMMDD>.<NN>, which
          # sort as text.
          release=$(jq -r --arg r "${REGION}" '[to_entries[] | select(.value[$r]) | .key] | sort | last // empty' images.json)
          if [ -z "${release}" ]; then
            echo "images.json has no release with an image in ${REGION}"; exit 1
          fi

          gh auth setup-git
          id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

          gh repo clone "${REPOSITORY}" deployment -- --quiet --depth 1
          cd deployment
          sed -i -E "s|(github.com/spin-stack/spin-terraform-aws\?ref=)[0-9a-f]+|\1${sha}|" main.tf
          sed -i -E "s|^(spin_version *= *)\"[^\"]*\"|\1\"${release}\"|" terraform.tfvars
          if git diff --quiet; then
            echo "${REPOSITORY} is at ${sha} and ${release} already"; exit 0
          fi

          # One branch per deployment, rewritten by each push: the pull request on it is the newest.
          branch=spin-terraform-aws/next
          git checkout -q -b "${branch}"
          git commit -q -a -m "module ${sha}, spin ${release}" \
            -m "spin-stack/spin-terraform-aws at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}, whose images.json has ${release} in ${REGION}. Proposed by its propose workflow; read the plan before merging."
          git push -q --force origin "${branch}"
          if [ -z "$(gh pr list -R "${REPOSITORY}" --head "${branch}" --state open --json number --jq '.[].number')" ]; then
            gh pr create -R "${REPOSITORY}" --head "${branch}" --base main --fill
          fi
