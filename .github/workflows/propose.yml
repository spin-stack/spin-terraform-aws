# The module as it is at the ref this runs on - main, or a release's tag - proposed to one
# installation made from it: a pull request in its deployment repository that moves the module's
# ref to it (the commit, or the tag) and spin_version to the newest release images.json has an
# image of there in the installation's region - one pull request per deployment, on a branch each
# run rewrites, so what waits there is always the newest. A person reads its plan, merges it and
# applies; nothing here reaches an installation.
#
# spin-stack/shipset, which coordinates a release's steps, dispatches this for each deployment its
# shipset.yaml names: on main for one that follows main (spinbox.dev, which dogfoods), on the
# newest release's tag for one that follows the releases a person cuts here. It finds the run
# again by its name.
#
# As the release app (spin-stack-release), so the deployment's plan runs on the pull request: one
# opened with this run's own token would start none, and could not reach another repository.
name: Propose
# What shipset looks the run up by: one deployment and one module - a release's tag, or a commit.
run-name: propose ${{ inputs.repository }} ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'The deployment repository in spin-stack, e.g. spinbox.dev-deploy.'
        required: true
      region:
        description: 'Its installation region, e.g. us-west-2.'
        required: true

concurrency:
  group: propose-${{ inputs.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Without this run's read-only token left in git's configuration, where it would be sent
      # ahead of the app's on the push to the deployment (spin's machine.yml was refused so).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: ${{ inputs.repository }}

      - name: Propose this commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: spin-stack/${{ inputs.repository }}
          REGION: ${{ inputs.region }}
        run: task propose
