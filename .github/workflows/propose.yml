# The module as it is at the ref this runs on - main, or a release's tag - proposed to one
# installation made from it: a pull request in its deployment repository that moves the module's
# ref to it (the commit, or the tag) - the release it runs is its own spin_version's, a release or
# a channel - one pull request per deployment, on a branch each
# run rewrites, so what waits there is always the newest. A person reads its plan, merges it and
# applies; nothing here reaches an installation.
#
# spin-stack/ship-it, which coordinates a release's steps, dispatches this for each deployment its
# ship-it.yaml names: on main for one that follows main (spinbox.dev, which dogfoods), on the
# newest release's tag for one that follows the releases a person cuts here. It finds the run
# again by its name, and this run wakes it once the pull request is open.
#
# As the release app (spin-stack-release), so the deployment's plan runs on the pull request: one
# opened with this run's own token would start none, and could not reach another repository.
name: Propose
# What ship-it looks the run up by: one deployment and one module - a release's tag, or a commit.
run-name: propose ${{ inputs.repository }} ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'The deployment repository in spin-stack, e.g. spinbox.dev-deploy.'
        required: true
      region:
        description: 'Its installation region, e.g. us-west-2, as ship-it names it: the module''s ref is all this moves.'
        required: true

concurrency:
  group: propose-${{ inputs.repository }}
  cancel-in-progress: true

permissions:
  contents: read

# go tool task downloads Task and go-tools' release from GitHub, which sheds anonymous requests
# first under load: the run's own token, with only what its permissions grant.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Without this run's read-only token left in git's configuration, where it would be sent
      # ahead of the app's on the push to the deployment (spin's machine.yml was refused so).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: ${{ inputs.repository }}

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Propose this commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: spin-stack/${{ inputs.repository }}
        run: go tool task propose

      # ship-it's deploy step reads the pull request this opened. Whatever the steps above did: a
      # wake that fails is a hint lost, not a proposal lost, so it never fails the run.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: always()
        id: wake
        continue-on-error: true
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: ship-it
          permission-contents: write

      - name: Wake ship-it
        if: always() && steps.wake.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.wake.outputs.token }}
          CONCLUSION: ${{ job.status }}
        run: go tool task ship-it:wake
