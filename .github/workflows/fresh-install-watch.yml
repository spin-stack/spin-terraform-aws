# Between fresh installs nothing of one should be in the account. This looks every three hours,
# removes what it finds as a run removes it, and opens an issue for what it cannot
# (hack/fresh-install-watch.sh). Looking costs a minute of a runner; removing, as long as it takes.
name: Fresh install watch

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

# The runs' own group: it waits for a run to end rather than taking what one is making for a leftover.
concurrency:
  group: fresh-install
  cancel-in-progress: false

permissions:
  contents: read

# As fresh-install.yml's: this removes that installation, and the removal refuses any other.
env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_region: us-east-1
  TF_VAR_name: fresh
  TF_VAR_tags: '{"spin:purpose": "fresh-install", "spin:run": "${{ github.run_id }}"}'

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: fresh-install
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Tools
        run: task fresh-install:tools

      # What the installation's variables want, for a destroy to plan: a run's own steps.
      - name: Release
        run: task fresh-install -- release

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.FRESH_INSTALL_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Domain
        env:
          ZONE_ID: ${{ vars.FRESH_INSTALL_ZONE_ID }}
        run: task fresh-install -- domain

      - name: Watch
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_ASSIGNEE: aledbf
        run: task fresh-install:watch
