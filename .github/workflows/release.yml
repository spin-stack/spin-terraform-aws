# This module's release, made from main and nothing else: dispatched there by a person, it names the
# next v<YYYYMMDD>.<NN> today - as spin names its own - and makes it a tag on the commit with its
# GitHub release, once Gate has passed on that commit. A release is what `?ref=` pins and what a
# deployment on the release track (spin-stack/ship-it's ship-it.yaml) is proposed next: ship-it
# reads the newest release and dispatches propose.yml on its tag, and this run only wakes it. A
# person decides when, and nothing else cuts one:
#
#   gh workflow run release.yml --ref main
name: Release

on:
  workflow_dispatch:

# One at a time: the version is named from the tags there are, so two at once would name the same.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # The tag and the release.
  contents: write
  # Whether Gate passed on the commit.
  checks: read

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The release is made through the API with this run's token, so git needs none of it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          checksum: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb # task_linux_amd64.tar.gz

      - name: Cut the next release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task release

      # Whatever the steps above did. A wake that fails is a hint lost, not a release lost: it
      # never fails the run.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: always()
        id: wake
        continue-on-error: true
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: ship-it
          permission-contents: write

      - name: Wake ship-it
        if: always() && steps.wake.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.wake.outputs.token }}
          CONCLUSION: ${{ job.status }}
        run: task ship-it:wake
