name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# go tool task downloads Task and go-tools' release from GitHub, which sheds anonymous requests
# first under load: the run's own token, with only what its permissions grant.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The check main's ruleset requires, named Gate in every spin-stack repository: lint and test.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # go tool task lint's testidentity reads the branch's commits since origin/main, which a pull
          # request's shallow checkout does not have.
          fetch-depth: 0

      # go tool task: go.mod's toolchain and go-tools.
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The pinned tools: format, validation, TFLint, Trivy, the modules' READMEs, and each module's
      # tests against its plan - no account, no credentials. TFLint fetches its AWS ruleset from
      # GitHub with the workflow's token too.
      - name: Lint and test
        run: go tool task lint
