name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The check main's ruleset requires, named Gate in every spin-stack repository: lint and test.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # task lint's testidentity reads the branch's commits since origin/main, which a pull
          # request's shallow checkout does not have.
          fetch-depth: 0

      # For task lint's gates, run from spin-stack/go-tools: its toolchain, there being no go.mod
      # here to name one, and no cache, there being no go.sum to key it.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
          checksum: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb # task_linux_amd64.tar.gz

      # The pinned tools: format, validation, TFLint, Trivy, the modules' READMEs, and each module's
      # tests against its plan - no account, no credentials. The token is the run's own, read-only:
      # TFLint fetches its AWS ruleset from GitHub, which rate-limits an anonymous runner.
      - name: Lint and test
        run: task lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
